<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Pulse</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <div class="hero-banner">
            <div class="hero-item">🌐 <span>SEO Insight</span></div>
            <div class="hero-item">⚡ <span>Performance</span></div>
            <div class="hero-item">📊 <span>Website Audit</span></div>
        </div>

        <h1>Page Pulse</h1>
        <p class="subtitle">Analyze any website in seconds and get a polished SEO report.</p>

        <form id="analyzeForm" class="input-section">
            <input type="text" id="url" placeholder="https://example.com" required>
            <button type="submit">Analyze Website</button>
        </form>

        <div id="result" class="result-area"></div>

        <div class="history-card">
            <div class="history-header">
                <h3>Recent Reports</h3>
                <span>Stored in your browser</span>
            </div>
            <ul id="historyList"></ul>
        </div>
    </div>

    <footer>
        Built for
        <a href="https://digitalheroesco.com" target="_blank">Digital Heroes Training Task</a>
    </footer>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
